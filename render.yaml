services:
  - type: web
    name: seevv-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && (npx puppeteer browsers install chrome || true)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/.cache/puppeteer
