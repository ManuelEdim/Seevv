name: Daily notifications

on:
  schedule:
    # 8am UTC daily — interview reminders
    # Mondays also trigger the weekly digest
    - cron: "0 8 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron digest endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://seevv.onrender.com/api/cron/digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Cron endpoint returned $STATUS"
            exit 1
          fi
