<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seevv</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 300px; background: #fff; color: #111; }
    .header { background: #033876; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    .header img { width: 20px; height: 20px; }
    .header h1 { font-size: 13px; font-weight: 700; }
    .body { padding: 16px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; font-size: 12px; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; }
    input:focus { border-color: #033876; box-shadow: 0 0 0 2px rgba(3,56,118,0.12); }
    button { width: 100%; padding: 10px; background: #033876; color: #fff; font-size: 13px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
    button:hover { background: #0a5aad; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 11px; text-align: center; min-height: 16px; }
    .status.ok  { color: #1d9e75; }
    .status.err { color: #e53e3e; }
    .login-note { font-size: 11px; color: #888; text-align: center; padding: 12px; }
    .login-note a { color: #033876; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Seevv" />
    <h1>Save to Seevv</h1>
  </div>
  <div class="body" id="main">
    <div class="field">
      <label>Job title</label>
      <input id="jobTitle" placeholder="e.g. Product Designer" />
    </div>
    <div class="field">
      <label>Company</label>
      <input id="company" placeholder="e.g. Acme Corp" />
    </div>
    <button id="saveBtn">Save to tracker</button>
    <p class="status" id="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
